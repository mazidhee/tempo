appId: com.habittracker.app
productName: Habit Tracker
directories:
  buildResources: build
  output: release
files:
  - dist-electron
  - dist
mac:
  category: public.app-category.productivity
  target: dmg
win:
  target: nsis
  icon: build/icon.png
nsis:
  shortcutName: Tempo
  uninstallDisplayName: Tempo
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
linux:
  target: AppImage
